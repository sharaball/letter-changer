<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>letter-changer site</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: #eee;
      padding: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      background: #222;
      color: #fff;
      border: 1px solid #444;
    }
    #output {
      margin-top: 20px;
      padding: 10px;
      background: #1b1b1b;
      border: 1px solid #333;
      min-height: 40px;
    }
  </style>
</head>
<body>

<h2>letter-changer</h2>

<input id="inputText" placeholder="Введи текст..." />
<div id="output"></div>

<script>
let map = {};

fetch("mapping.txt")
  .then(r => r.text())
  .then(text => {
    text.split("\n").forEach(line => {
      let parts = line.split("-");
      if (parts.length >= 2) {
        let key = parts[0].trim();
        let values = parts[1]
          .trim()
          .split(" ")
          .filter(v => v.length > 0);

        map[key] = values;
      }
    });
  });

function randomChoice(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function transform(text) {
  let result = "";

  for (let char of text) {
    if (map[char]) {
      result += randomChoice(map[char]);
    } else {
      result += char;
    }
  }

  return result;
}

document.getElementById("inputText").addEventListener("input", (e) => {
  document.getElementById("output").innerText = transform(e.target.value);
});
</script>

</body>
</html>
