<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>sharaball's letter-changer</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: #eee;
      padding: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      font-size: 16px;
    }

    #output {
      margin-top: 20px;
      padding: 10px;
      background: #1b1b1b;
      border: 1px solid #333;
      min-height: 40px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<h2>letter changer</h2>

<input id="inputText" placeholder="ur text goes here" />
<div id="output"></div>

<script>
let map = {};

fetch("mapping.txt")
  .then(res => res.text())
  .then(text => {
    text.split("\n").forEach(line => {
      line = line.trim();
      if (!line || !line.includes("-")) return;

      let [key, values] = line.split("-");
      
      key = key.trim();
      values = values.trim().split(/\s+/);

      map[key] = values; в
    });
  });

function random(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function transform(text) {
  let out = "";

  for (let char of text) {
    if (map[char]) {
      out += random(map[char]);
    } else {
      out += char;
    }
  }

  return out;
}

document.getElementById("inputText").addEventListener("input", (e) => {
  document.getElementById("output").textContent = transform(e.target.value);
});
</script>

</body>
</html>
